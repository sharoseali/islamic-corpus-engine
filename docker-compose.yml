name: islamic-knowledge-core

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ikc_postgres
    restart: unless-stopped
    # Parallel index builds and parallel queries exchange data through
    # /dev/shm, which Docker caps at 64 MB by default.
    shm_size: "4gb"
    # Memory for a 3 GB vector index and its HNSW rebuilds; the defaults
    # (128 MB shared buffers, 64 MB maintenance memory) are far too small.
    command:
      - postgres
      - -c
      - shared_buffers=4GB
      - -c
      - effective_cache_size=12GB
      - -c
      - maintenance_work_mem=2GB
      - -c
      - work_mem=32MB
      - -c
      - max_parallel_maintenance_workers=4
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - jit=off
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-islamic_corpus}
      POSTGRES_USER: ${POSTGRES_USER:-ice_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Deterministic text behavior: C collation with UTF-8 storage.
      # Arabic ordering is handled explicitly with ICU collations at the
      # column/query level, never left to the OS locale.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ikc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ice_admin} -d ${POSTGRES_DB:-islamic_corpus}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ikc_pgdata:
