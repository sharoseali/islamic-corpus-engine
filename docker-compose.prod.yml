# Elaaj production stack: PostgreSQL + API + frontend behind Caddy (HTTPS).
#
#   cp deploy/env.production.example .env   # then edit
#   docker compose -f docker-compose.prod.yml up -d --build
#   scripts/release_restore.sh <bundle-dir>  # first time: data + models
#
# Only Caddy publishes ports. The API is reachable solely through Caddy at
# /api/v1 (and from the frontend container); PostgreSQL is internal.
# See docs/DEPLOYMENT.md.

name: elaaj

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    shm_size: "${PG_SHM_SIZE:-1gb}"
    # Memory settings scale with the server: shared_buffers about a quarter
    # of RAM, effective_cache_size about half. The vector index is 1.5 GB
    # and is best kept in memory.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-2GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-6GB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-1GB}
      - -c
      - work_mem=32MB
      - -c
      - max_parallel_maintenance_workers=${PG_PARALLEL_WORKERS:-2}
      - -c
      - max_parallel_workers_per_gather=${PG_PARALLEL_WORKERS:-2}
      - -c
      - jit=off
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-islamic_corpus}
      POSTGRES_USER: ${POSTGRES_USER:-ice_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ice_admin} -d ${POSTGRES_DB:-islamic_corpus}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      APP_ENV: ${APP_ENV:-production}
      HF_HOME: /app/corpus/cache/hf
      API_WORKERS: ${API_WORKERS:-1}
    # Must be able to write corpus/ on the host (manifests, Whisper cache).
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes:
      - ./corpus:/app/corpus
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8400/api/v1/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: http://api:8400/api/v1
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: http://api:8400/api/v1
    depends_on:
      api:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      # A domain name gives automatic HTTPS (Let's Encrypt); ":80" serves
      # plain HTTP on a bare IP address.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
