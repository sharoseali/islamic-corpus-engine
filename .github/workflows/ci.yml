name: CI

# Runs on every push and pull request targeting the working branch (dev)
# and the production branch (main). Keeps both green before anything is merged
# toward production.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A newer push to the same ref cancels the older in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile all modules (syntax check)
        run: python -m compileall -q app scripts

      # TODO: add `ruff check .` once a linter config is added to the repo.
      # TODO: add `pytest` once tests are written (spin up a postgres service
      #       container here when integration tests need the database).

  frontend:
    name: Frontend (Next.js type-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # next-env.d.ts is git-ignored and normally written by `next build`.
      # Recreate the standard stub so tsc sees the Next.js ambient types.
      - name: Generate Next type stub
        run: printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts

      - name: Type-check
        run: npx --no-install tsc --noEmit

      # NOTE: a full `next build` is intentionally omitted for now. The pages
      # fetch content from the backend API at build time, which is not reachable
      # in CI. Add a build job once the API can be seeded or reached from CI.
