name: Deploy (production)

# Deploys the main branch to the production server over SSH: pull, rebuild
# the images, restart the stack, apply migrations, check health.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SSH_HOST     server address
#   SSH_USER     login user (owns the checkout, member of the docker group)
#   SSH_KEY      private key whose public half is in that user's
#                authorized_keys
# Optional: SSH_PORT (22), DEPLOY_PATH (/srv/elaaj).
#
# Until SSH_HOST is set the job does nothing and ends green, so merging to
# main is safe before the server exists. Add protection rules to the
# "production" environment to require a manual approval per deploy.

on:
  workflow_dispatch: {}
  push:
    branches: [main]

# Never run two production deploys at once, and never cancel one midway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
    steps:
      - name: Check that a server is configured
        id: server
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No SSH_HOST secret is set; nothing to deploy to yet."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.server.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 40m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH || '/srv/elaaj' }}"
            git fetch --prune origin
            git checkout -q main
            git reset -q --hard origin/main
            echo "deploying $(git rev-parse --short HEAD)"
            docker compose -f docker-compose.prod.yml build --pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml exec -T api alembic upgrade head
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml exec -T api python -c \
                "import urllib.request as u; u.urlopen('http://127.0.0.1:8400/api/v1/health', timeout=5)" 2>/dev/null; then
                echo "api healthy"; break
              fi
              [ "$i" = 30 ] && { echo "api did not become healthy"; docker compose -f docker-compose.prod.yml logs --tail=50 api; exit 1; }
              sleep 5
            done
            docker image prune -f >/dev/null
            docker compose -f docker-compose.prod.yml ps
